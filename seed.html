  <style>

      { nombre:'Sorrentinos Caprese',           categoria:'Rellenas',  desc:'Rellenos de tomate seco, mozzarella fresca y albahaca',                      precio:2700, emoji:'🍅', imagen:'https://images.unsplash.com/photo-1621996346565-e3dbc646d9a9?w=600&q=80' },
      { nombre:'Fagottinis',                    categoria:'Rellenas',  desc:'Pastelitos rellenos con forma de saquito, sorpresa del chef adentro',        precio:2900, emoji:'🎁', imagen:'https://images.unsplash.com/photo-1551183053-bf91798d047e?w=600&q=80' },
      { nombre:'Ñoquis de Papa',                categoria:'Ñoquis',    desc:'Suaves y esponjosos, elaborados con papa blanca del día. Receta de la nonna',precio:1800, emoji:'🥔', imagen:'https://images.unsplash.com/photo-1598866594230-a7c12756260f?w=600&q=80' },

      { nombre:'Tallarines',                    categoria:'Largas',    desc:'Pasta larga al huevo, tierna y sedosa. Corte clásico que nunca falla',       precio:1600, emoji:'🍝', imagen:'https://images.unsplash.com/photo-1555949258-eb67b1ef0ceb?w=600&q=80' },

      { nombre:'Harina 000 Artesanal',          categoria:'Almacen',   desc:'Harina de trigo extra fina, ideal para hacer tu propia pasta en casa',      precio:850,  emoji:'🌾', imagen:'https://images.unsplash.com/photo-1574323347407-f5e1ad6d020b?w=600&q=80' },
      { nombre:'Aceite de Oliva Extra Virgen',  categoria:'Almacen',   desc:'Primer prensado en frío, cosecha propia del año',                           precio:2800, emoji:'🫒', imagen:'https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?w=600&q=80' },
      { nombre:'Mix de Hierbas Italianas',      categoria:'Almacen',   desc:'Orégano, albahaca, tomillo y romero. Selección artesanal deshidratada',     precio:650,  emoji:'🌿', imagen:'https://images.unsplash.com/photo-1466637574441-749b8f19452f?w=600&q=80' },
    ];

    const CONFIG = { nombre: 'MIRU', wa: '5491112345678', msg: 'Hola! Quiero hacer un pedido en MIRU:' };
    const SEGURIDAD = { password: 'miru2026' };

    function log(msg, type) {
      document.getElementById('log').innerHTML += `<span class="${type || ''}">${msg}</span>\n`;
    }

    async function seed() {
      const btn = document.getElementById('btn');
      btn.disabled = true;
      btn.textContent = 'CARGANDO...';

      try {
        // Config
        await db.collection('config').doc('tienda').set(CONFIG);
        log('✓ Config tienda cargada', 'ok');

        await db.collection('config').doc('seguridad').set(SEGURIDAD);
        log('✓ Config seguridad cargada (pass: miru2026)', 'ok');

        // Productos
        const batch = db.batch();
        PRODUCTOS.forEach(p => {
          const ref = db.collection('productos').doc();
          batch.set(ref, p);
        });
        await batch.commit();
        log(`✓ ${PRODUCTOS.length} productos cargados`, 'ok');

        log('\n══════════════════════════════════', 'ok');
        log('  LISTO. Ya podés cerrar esta página.', 'ok');
        log('  Verificá en Firebase Console > Firestore', 'ok');
        log('══════════════════════════════════', 'ok');

      } catch(e) {
        log('✗ Error: ' + e.message, 'err');
        console.error(e);
        btn.disabled = false;
        btn.textContent = 'REINTENTAR';
      }
    }
  </script>
</body>
</html>
