/* Tienda online: portada, carta por secciones con fotos, detalle de cada plato, carrito y hoja del pedido. Pensada para el celular.

:root{--bg:#F5F4F1;--sf:#FFFFFF;--sf2:#F1EFEB;--ink:#1C1B19;--mu:#6A665F;--line:#E3E0DA;--good:#1D7A4C;--bad:#B3261E;--c:#E3B44A;--ci:#1D1600;--r:14px;--rb:12px;--f:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--fh:var(--f);color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--f);-webkit-font-smoothing:antialiased;padding-bottom:104px}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
h1,h2,h3,h4,p{margin:0}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.in{max-width:760px;margin:0 auto;padding:0 14px}
/* portada */
.cov{height:176px;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 50%,#000))}

.cov::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.28))}
.cov.sin{height:112px}
.hid{display:flex;gap:14px;align-items:flex-end;margin-top:-46px;position:relative;z-index:1}
.logo{flex:none;width:92px;height:92px;border-radius:calc(var(--r) + 4px);background:var(--sf);border:4px solid var(--bg);overflow:hidden;display:flex;align-items:center;justify-content:center;font:800 36px var(--fh);color:var(--c);box-shadow:0 4px 14px rgba(0,0,0,.14)}
.logo img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s}.logo img.ok{opacity:1}
.hid h1{font:800 27px/1.1 var(--fh);letter-spacing:-.01em;padding-bottom:6px}
.sub{margin-top:10px;color:var(--mu);font-weight:500}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:12px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--sf);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-weight:600;font-size:14px}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--good)}.pill.no i{background:var(--bad)}
.aviso{margin-top:14px;border-radius:var(--r);padding:12px 14px;background:color-mix(in srgb,var(--c) 16%,var(--sf));border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));font-weight:600}

.buscar{display:flex;gap:8px;align-items:stretch}.buscar .search{flex:1;min-width:0}

.search:focus{outline:0;border-color:var(--c)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-top:8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--sf);border-radius:99px;padding:6px 14px;font-weight:600;font-size:14px;white-space:nowrap}

/* botones */
.add{flex:none;width:38px;height:38px;border-radius:50%;border:0;background:var(--c);color:var(--ci);font-size:22px;font-weight:700;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.stp{flex:none;display:flex;align-items:center;gap:8px}.stp button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--sf);font-weight:700;font-size:18px;line-height:1}.stp b{min-width:18px;text-align:center}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:26px 14px;text-align:center;color:var(--mu);margin-top:16px}
/* pie */
.card{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:12px}
.card h4{margin:0 0 8px;font:700 15px var(--fh)}
.card p{color:var(--mu);font-size:15px}
.ct{display:flex;gap:10px;padding:5px 0;font-size:15px}.ct i{flex:none;font-style:normal;width:22px;text-align:center}.ct a{color:var(--ink);font-weight:600}
/* carrito */
.cartb{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 35%)}
.cartb button{display:flex;align-items:center;gap:10px;width:100%;max-width:732px;margin:0 auto;border:0;border-radius:var(--rb);background:var(--c);color:var(--ci);padding:15px 18px;font-weight:800;font-size:17px;box-shadow:0 6px 18px rgba(0,0,0,.22)}
.cartb em{font-style:normal;background:var(--ci);color:var(--c);border-radius:99px;min-width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;padding:0 8px;font-size:14px}
.cartb span{flex:1;text-align:left}
.cartb .min{display:block;max-width:732px;margin:0 auto;text-align:center;font-size:13px;font-weight:700;color:var(--mu);padding-bottom:6px}
/* detalle de un plato */
#det{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center}
#det .bk{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.dsh{position:relative;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;background:var(--sf);border-radius:calc(var(--r) + 8px) calc(var(--r) + 8px) 0 0;animation:sube .22s ease-out}
@keyframes sube{from{transform:translateY(40px);opacity:.4}}
.dsh.quieta{animation:none}
.dsh .ph.gr{aspect-ratio:4/3;width:100%}
.dsh .cx{position:absolute;top:10px;right:10px;z-index:2;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#1C1B19;font-size:22px;line-height:1;box-shadow:0 2px 8px rgba(0,0,0,.2)}

.x{border:1px solid var(--line);background:var(--sf);border-radius:99px;padding:7px 13px;font-weight:600}
label.f{display:block;font-size:13px;font-weight:600;color:var(--mu);margin-top:10px}
.inp{display:block;width:100%;margin-top:4px;border:1px solid var(--line);background:var(--sf);border-radius:10px;padding:11px 12px;font-size:16px;font-weight:400;color:var(--ink)}

.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--sf);padding:11px 8px;font-weight:600;border-left:1px solid var(--line)}.seg button:first-child{border-left:0}.seg button.on{background:var(--c);color:var(--ci)}
.seg:has(button:nth-child(3)) button{font-size:14px;padding:11px 4px}
.tot{display:flex;justify-content:space-between;padding:4px 0}.tot.g{font-size:20px;font-weight:800;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.go{display:block;width:100%;margin-top:14px;border:0;border-radius:var(--rb);background:var(--c);color:var(--ci);padding:15px;font-weight:800;font-size:17px}

.mu{color:var(--mu);font-size:14px}
.ok1{text-align:center;padding:30px 0 10px}.ok1 b{display:block;font:800 26px var(--fh);margin-bottom:6px}

<script type="module">
/* ==================== Tienda online ====================
   · No pide cuenta. Lee un solo documento público, tienda/{negocio}, que la app de gestión publica con la carta
     a la venta, el aspecto elegido, las zonas de envío y el horario. Las fotos están aparte, en tienda/{negocio}/fotos,
     y se bajan después de mostrar la carta.
   · El pedido se guarda en tienda/{negocio}/pedidos. La app de gestión lo pasa al tablero como Pendiente
     y vuelve a calcular los precios con la carta del gestor (lo que manda el celular no se toma como precio).
   · Con Mercado Pago (si está activado) el pedido lo arma y lo cobra el servidor (functions/index.js): ver pagarMP().
   · Con ?vista=1 es la vista previa que se ve dentro de la app: no usa Firebase, recibe los datos por mensaje. */
const V = '12.19.0', CDN = `https://www.gstatic.com/firebasejs/${V}/`;

/* ---- Mercado Pago ----
   El pedido no se guarda desde el celular: lo arma la función mpCrear con la carta publicada (precios, salsas, envío),
   devuelve el link de pago y el cliente paga en Mercado Pago. Cuando el pago se aprueba, el pedido entra a la app de Gestión
   ya cobrado. Antes de salir se guarda el carrito en este navegador, por si el pago no se completa. */
async function llamar(nombre, data) {
  const FN = await import(CDN + 'firebase-functions.js');
  return (await FN.httpsCallable(FN.getFunctions(appF, 'southamerica-east1'), nombre)(data)).data;
}
async function pagarMP(L, del, v) {
  const tk = nuevoTk();
  const ped = { cli: v('cli').slice(0, 60), tel: v('tel').slice(0, 30), tipo: del ? 'delivery' : 'retiro', dir: del ? (v('dir') + (mapaOn() && v('dir2') ? ' · ' + v('dir2') : '')).slice(0, 160) : '', zona: del && zona() ? zona().id : '', ...(del && mapaOn() && tieneGeo() ? { lat: +datos.lat.toFixed(6), lng: +datos.lng.toFixed(6), pid: String(datos.pid || '').slice(0, 200) } : {}), nota: v('nota').slice(0, 200), items: L.map(l => ({ r: l.p.id, q: l.n, ...(l.o ? { s: l.o.id } : {}) })), tk };
  try {
    const r = await llamar('mpCrear', { n: slug, ped });
    if (!r || !r.url || !/^https:\/\/([a-z0-9-]+\.)*mercadopago\.com(\.ar)?\//.test(r.url)) throw new Error('sin-link');
    const h = { ...ped, pago: 'Mercado Pago', id: r.p, tk: r.tk, total: r.total, envio: envio(), lineas: L.map(l => ({ n: l.n, nombre: l.nombre, total: l.u * l.n })), carrito: [...cart] };
    try {
      localStorage.setItem('tienda_mp_' + slug, JSON.stringify(h));
      localStorage.setItem('tienda_datos', JSON.stringify({ cli: ped.cli, tel: ped.tel, dir: v('dir'), dir2: v('dir2'), zona: datos.zona, tipo: datos.tipo, pago: 'Mercado Pago', ...(mapaOn() && datos.ver && datos.ver.ok ? { lat: datos.lat, lng: datos.lng, pid: datos.pid, nok: true } : {}) }));
    } catch (e) {}
    location.href = r.url;
  } catch (e) {
    enviando = false; error = e && e.code === 'functions/failed-precondition' && e.message ? e.message : 'No pudimos abrir Mercado Pago. Probá de nuevo o elegí otro medio de pago.'; hoja();
  }
}
/* Vuelta de Mercado Pago: ?mp=ok|pend|fallo&p=idPedido (&payment_id que agrega Mercado Pago) */
async function volverDeMP() {
  const m = params.get('mp'), p = params.get('p'); if (!m || !/^[0-9]{13,16}$/.test(p || '')) return;
  let h = null; try { h = JSON.parse(localStorage.getItem('tienda_mp_' + slug) || 'null') } catch (e) {}
  history.replaceState(null, '', location.pathname + (params.get('n') ? '?n=' + encodeURIComponent(params.get('n')) : ''));
  if (!h || String(h.id) !== p) { toast(m === 'fallo' ? 'El pago no se completó' : 'Volviste de Mercado Pago'); return }
  let est = m === 'fallo' ? 'rechazado' : 'pendiente';
  if (m !== 'fallo') { try { est = (await llamar('mpEstado', { n: slug, p, pay: params.get('payment_id') || params.get('collection_id') || '' })).estado || est } catch (e) {} }
  if (est === 'pagado' || (m !== 'fallo' && est !== 'rechazado')) {
    try { localStorage.removeItem('tienda_mp_' + slug) } catch (e) {}
    guardarLocal({ tk: h.tk, id: h.id, total: h.total, fecha: Date.now() }); SEG.set(h.tk, { tk: h.tk, sin: true, id: h.id, total: h.total });
    hecho = { ...h, mpEst: est }; delete hecho.carrito; hoja(); cargarMis().then(refrescarTop);
  } else { // no se pagó: vuelve el carrito para intentar de nuevo
    (h.carrito || []).forEach(([k, n]) => cart.set(k, n)); refrescarBotones();
    error = 'El pago no se completó y el pedido no se envió. Podés intentar de nuevo o elegir otro medio de pago.'; hoja();
  }
}

/* ==================== Cuenta del cliente, seguimiento e historial ====================
   · Sin cuenta: cada pedido tiene un código secreto (tk). El navegador lo guarda y con él ve el estado del pedido.
   · Con cuenta (correo o Google): los pedidos quedan atados al usuario y se ven desde cualquier celular.
   · El estado lo publica la app de Gestión en tienda/{negocio}/seguimiento/{tk} cada vez que el pedido cambia
     (por eso se actualiza mientras la app del local esté abierta). */
let AU = null, auth = null, appF = null, usuario = null, perfil = null, registrando = false;

const cuandoDe = id => { const d = new Date(Math.floor(+id / 1000)); if (isNaN(d)) return ''; const hm = d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false }), h = new Date(); return (d.toDateString() === h.toDateString() ? 'Hoy' : d.toLocaleDateString('es-AR', { day: 'numeric', month: 'short' })) + ' · ' + hm };

const locales = () => { try { const l = JSON.parse(localStorage.getItem('tienda_pedidos_' + slug) || '[]'); return Array.isArray(l) ? l : [] } catch (e) { return [] } };

async function cargarSeg(tk) {
  try { const d = await FS.getDoc(refSeg(tk)); if (d.exists()) SEG.set(tk, { tk, ...d.data() }); else if (!SEG.has(tk)) SEG.set(tk, { tk, sin: true }) } catch (e) { if (!SEG.has(tk)) SEG.set(tk, { tk, sin: true }) }

/* Mis pedidos: los de la cuenta (si hay) más los que este navegador guardó */
async function cargarMis() {

const refPerfil = uid => FS.doc(db, 'tienda', slug, 'usuarios', uid);

async function hacerCuenta(que) {

        const c = await AU.createUserWithEmailAndPassword(auth, v('email'), fc.pw);
        try { await AU.updateProfile(c.user, { displayName: v('nombre') }) } catch (e) {}
        usuario = { uid: c.user.uid, email: c.user.email || v('email'), nombre: v('nombre') };
        try { await guardarPerfil() } catch (e) {}
        registrando = false; fc.pw = ''; vistaC = hojaAbierta() ? null : 'pedidos'; cargarMis().then(() => { refrescarTop(); if (vistaC) cuentaUI() }); toast('¡Cuenta creada!');
      } else { await AU.signInWithEmailAndPassword(auth, v('email'), fc.pw); fc.pw = '' }
    } else if (que === 'olvide') {
      if (!/^\S+@\S+\.\S+$/.test(v('email'))) { errA = 'Escribí tu correo arriba y tocá de nuevo.'; cuentaUI(); return }
      await AU.sendPasswordResetEmail(auth, v('email')); avisoA = 'Te mandamos un correo para elegir una contraseña nueva.';
    } else if (que === 'perfil') {
      if (v('nombre').length < 2) { errA = 'Escribí tu nombre.'; cuentaUI(); return } if (v('tel').replace(/\D/g, '').length < 8) { errA = 'Escribí un teléfono para poder avisarte.'; cuentaUI(); return }
      ocupado = true; cuentaUI(); await guardarPerfil(); toast('Datos guardados');
      if (hojaAbierta()) vistaC = null; else { vistaC = 'pedidos'; cargarMis().then(cuentaUI) }
    }
  } catch (e) { registrando = false; errA = e && e.msg ? e.msg : errAuth(e) }
  ocupado = false; cuentaUI(); if (!$('#sheet').hidden && !hecho) hoja();
}
let toastT = 0;
function toast(t) { const n = $('#aviso'); n.textContent = t; n.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => n.classList.remove('on'), 2200) }

/* El estado se vuelve a pedir solo mientras se mira */
async function refrescarSeg() {
  if (VISTA || !db) return;
  if (vistaC === 'pedidos' || vistaC === 'pedido') { await cargarMis(); refrescarTop(); cuentaUI() }
  else if (hecho && !$('#sheet').hidden) { await cargarSeg(hecho.tk); const n = $('#segui'); if (n) n.innerHTML = segHtml(SEG.get(hecho.tk)) }
}
setInterval(refrescarSeg, 25000);

/* Los datos llegan de Firebase (tienda real) o de la app (vista previa) */
function mostrar() {
  tema();
  if (/^Hacé tu pedido$/.test(document.title)) document.title = T.nombre + ' · Hacé tu pedido'; // en tiendamiru.com/pedir/ queda el título con SEO
  pintar(); if (detId) detalle();
}
async function cargarFotos() {
  const ids = Object.keys(T.fotos || {}); if (!ids.length) return;
  try { const s = await FS.getDocs(FS.collection(db, 'tienda', slug, 'fotos')); s.forEach(d => { const x = d.data().d; if (typeof x === 'string' && x.startsWith('data:image/')) FOTOS[d.id] = x }); aplicarFotos(); if (detId) detalle() } catch (e) {}
}

if (VISTA) {
  addEventListener('message', e => {
    if (e.origin !== location.origin || !e.data || e.data.tn !== 'datos') return;
    T = e.data.T; if (e.data.fotos) { Object.keys(FOTOS).forEach(k => delete FOTOS[k]); Object.assign(FOTOS, e.data.fotos) } mostrar();
  });
  parent.postMessage({ tn: 'listo' }, location.origin);
} else {
  try {
    const cfg = window.NUBE_CONFIG && window.NUBE_CONFIG.firebase;
    const [{ initializeApp }, fs] = await Promise.all([import(CDN + 'firebase-app.js'), import(CDN + 'firebase-firestore-lite.js')]); // las dos a la vez
    FS = fs;
    appF = initializeApp(cfg); db = FS.getFirestore(appF);
    const s = await FS.getDoc(FS.doc(db, 'tienda', slug));
    if (!s.exists()) throw new Error('sin-tienda');
    T = JSON.parse(s.data().j);
    mostrar(); cargarFotos(); iniciarAuth(); cargarMis().then(refrescarTop); volverDeMP();
    { const pl = params.get('plato'); if (pl && plato(pl) && !params.get('mp')) { detId = String(plato(pl).id); detS = ''; detalle() } } // enlace directo a un plato (lo usa tiendamiru.com)
    setInterval(() => { if ($('#sheet').hidden && !detId && document.activeElement.id !== 'q' && estado().ok !== okAntes) pintar(); else { const e = estado(), n = $('#est'); if (n) { n.lastChild.textContent = e.txt } } }, 60000); // el cartel de abierto o cerrado se actualiza solo
  } catch (e) {
    $('#app').innerHTML = `<div class="ld">${e && e.message === 'sin-tienda' ? 'Esta tienda todavía no está publicada.' : 'No pudimos cargar la carta. Revisá tu conexión y recargá la página.'}</div>`;
  }
}
</script>
